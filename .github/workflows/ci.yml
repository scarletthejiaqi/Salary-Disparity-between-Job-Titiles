name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      # setup-r points renv at Posit Package Manager binaries; keep that and add
      # CRAN as a fallback for versions PPM has not published yet.
      - name: Add CRAN fallback repository
        run: echo "RENV_CONFIG_REPOS_OVERRIDE=PPM=${RENV_CONFIG_REPOS_OVERRIDE};CRAN=https://cloud.r-project.org" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-renv@v2

      - name: Unit and app smoke tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Lint
        run: |
          Rscript -e 'install.packages("lintr", repos = "https://cloud.r-project.org")'
          Rscript -e 'lints <- c(lintr::lint_dir("R"), lintr::lint_dir("pipeline")); print(lints)'
